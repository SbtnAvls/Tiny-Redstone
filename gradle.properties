# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1,1.22)
# The NeoForge version must agree with the Minecraft version to get a valid artifact
neoforge_version=21.1.77
# The NeoForge version range
neoforge_version_range=[21.1,)
# The loader version range can only use the major version of NeoForge/FML as bounds
loader_version_range=[4,)

# The mapping channel to use for mappings.
# The default set of supported mapping channels are ["official", "parchment"].
# Parchment is an unofficial project maintained by ParchmentMC, separate from NeoForge
# Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
mapping_channel=official
# The mapping version to query from the mapping channel.
mapping_version=1.21.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
mod_id=tinyredstone
# The human-readable display name for the mod.
mod_name=Tiny Redstone
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GNU GENERAL PUBLIC LICENSE
# The mod version. See https://semver.org/
mod_version=1.21.1-6.0.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=com.dannyandson.tinyredstone
# The authors of the mod.
mod_authors=Danny
# The description of the mod.
mod_description=Tiny redstone components and panels for making tiny redstone circuits.
